<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftFix Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#667eea,#764ba2,#4facfe,#00f2fe);
background-size:400% 400%;
animation:gradientMove 10s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.form-container{
width:380px;
padding:45px 35px;
border-radius:25px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 20px 40px rgba(0,0,0,0.3);
color:#fff;
}

.form-container h2{
text-align:center;
margin-bottom:30px;
font-size:28px;
letter-spacing:1px;
}

.input-group{
position:relative;
margin-bottom:25px;
}

.input-group input{
width:100%;
padding:14px 12px;
border:none;
border-radius:12px;
outline:none;
background:rgba(255,255,255,0.2);
color:#fff;
font-size:16px;
transition:0.3s;
}

.input-group label{
position:absolute;
top:14px;
left:12px;
color:#eee;
font-size:15px;
pointer-events:none;
transition:0.3s;
}

.input-group input:focus,
.input-group input:valid{
background:rgba(255,255,255,0.35);
}

.input-group input:focus + label,
.input-group input:valid + label{
top:-10px;
left:10px;
font-size:12px;
background:#764ba2;
padding:2px 8px;
border-radius:8px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#00f2fe,#4facfe);
color:#000;
transition:0.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 10px 20px rgba(0,0,0,0.4);
}

.links{
text-align:center;
margin-top:20px;
font-size:14px;
}

.links a{
color:#fff;
text-decoration:none;
display:block;
margin-top:8px;
}

.links a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="form-container">

<h2>SwiftFix Login</h2>

<form action="login.php" method="post" id="loginForm">

<div class="input-group">
<input type="text" name="username" required>
<label>Username</label>
</div>

<div class="input-group">
<input type="password" name="password" required>
<label>Password</label>
</div>

<button type="submit">Login</button>

</form>

<div class="links">
<a href="forgot_password.html">Forgot Password?</a>
<a href="signup.html">New user? Register</a>
</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

const user=document.querySelector('input[name="username"]').value.trim();
const pass=document.querySelector('input[name="password"]').value.trim();

if(!user || !pass){
alert("Please enter both username and password");
e.preventDefault();
return;
}

/* mark user as logged in */
localStorage.setItem("userLoggedIn","true");

});

</script>

</body>
</html>
